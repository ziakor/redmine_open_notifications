name: CI & Automated Release Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  lint-and-syntax:
    name: 1. Syntax & Lint Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Verify Ruby Syntax
        run: |
          set -eo pipefail
          find . -name "*.rb" -exec ruby -c {} +

      - name: Validate YAML Locales
        run: |
          set -eo pipefail
          ruby -e "require 'yaml'; Dir.glob('config/locales/*.yml').each { |f| YAML.load_file(f) }"

  test:
    name: 2. Test Suite (Ruby ${{ matrix.ruby-version }})
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        ruby-version: ['3.0', '3.1', '3.2']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Install Test Dependencies
        run: |
          set -eo pipefail
          gem install activesupport minitest --no-document

      - name: Run Unit & Integration Tests
        run: |
          set -eo pipefail
          ruby -Iapp/services -Iapp/models -Itest test/unit/mention_parser_test.rb
          ruby -Iapp/services -Iapp/models -Itest test/unit/user_notification_preference_test.rb
          ruby -Iapp/services -Iapp/models -Itest test/unit/webhook_delivery_service_test.rb

  auto-tag-and-release:
    name: 3. Tagging & GitHub Release Publication
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Commit Format & Safety Gate
        id: commit_check
        run: |
          set -eo pipefail
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit Message: $COMMIT_MSG"
          
          if echo "$COMMIT_MSG" | grep -iqE '^(feat|fix|perf|revert)(\([a-z0-9_-]+\))?!?:|BREAKING[ -]CHANGE:'; then
            echo "SHOULD_TAG=true" >> $GITHUB_ENV
            echo "Valid conventional commit detected. Proceeding with version tagging."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SHOULD_TAG=true" >> $GITHUB_ENV
            echo "Manual workflow dispatch trigger. Proceeding with version tagging."
          else
            echo "::error::Commit message does NOT follow Conventional Commits standard (feat:, fix:, BREAKING CHANGE:). Release pipeline aborted."
            exit 1
          fi

      - name: Calculate, Tag & Push Git Version Tag
        run: |
          set -eo pipefail
          
          if ! git describe --tags --abbrev=0 >/dev/null 2>&1; then
            echo "No existing release tags found. Setting initial version tag to v1.0.0."
            NEW_TAG="v1.0.0"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0)
            echo "Current Version Tag: $LATEST_TAG"
            
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            COMMIT_MSG=$(git log -1 --pretty=%B)
            
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              BUMP="${{ github.event.inputs.bump_type }}"
            elif echo "$COMMIT_MSG" | grep -iqE '^(feat!|BREAKING[ -]CHANGE:)'; then
              BUMP="major"
            elif echo "$COMMIT_MSG" | grep -iqE '^feat'; then
              BUMP="minor"
            else
              BUMP="patch"
            fi

            if [ "$BUMP" = "major" ]; then
              NEW_TAG="v$((MAJOR+1)).0.0"
            elif [ "$BUMP" = "minor" ]; then
              NEW_TAG="v${MAJOR}.$((MINOR+1)).0"
            else
              NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH+1))"
            fi
          fi

          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Calculated Version Tag: $NEW_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Create Release Packaging Archive
        run: |
          set -eo pipefail
          PACKAGE_NAME="redmine_open_notifications-${{ env.NEW_TAG }}"
          mkdir -p build/${PACKAGE_NAME}
          rsync -av --exclude='.git*' --exclude='build' --exclude='test' ./ build/${PACKAGE_NAME}/
          cd build
          zip -r "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"
          tar -czvf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Redmine Open Notifications ${{ env.NEW_TAG }}
            
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed release notes.
            
            ### Package Archives:
            - `redmine_open_notifications-${{ env.NEW_TAG }}.zip`
            - `redmine_open_notifications-${{ env.NEW_TAG }}.tar.gz`
          files: |
            build/redmine_open_notifications-*.zip
            build/redmine_open_notifications-*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
